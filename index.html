<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mastermind</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Colour code</p>
          <h1>Mastermind</h1>
        </div>
        <div class="top-actions" aria-label="Game summary">
          <div class="stat">
            <span>Turn</span>
            <strong id="turn-count">1</strong>
          </div>
          <div class="stat">
            <span>Best</span>
            <strong id="best-score">--</strong>
          </div>
          <button class="icon-button text-button" id="new-game" type="button">
            <span aria-hidden="true">&#8635;</span>
            <span>New</span>
          </button>
        </div>
      </header>

      <section class="palette-band" aria-labelledby="palette-heading">
        <h2 class="sr-only" id="palette-heading">Colour choices</h2>
        <div class="colour-tray" id="colour-tray"></div>
      </section>

      <section class="game-layout">
        <div class="board-area">
          <div class="secret-row" aria-label="Hidden target combination">
            <span class="secret-label">Target</span>
            <div class="secret-pegs" id="secret-pegs"></div>
          </div>
          <div class="board" id="board" aria-label="Guess board"></div>
        </div>

        <aside class="score-panel" aria-labelledby="score-heading">
          <div class="panel-heading">
            <h2 id="score-heading">Score</h2>
            <span id="game-state">In play</span>
          </div>
          <ol class="score-list" id="score-list"></ol>
          <p class="status-message" id="status-message" role="status" aria-live="polite"></p>
        </aside>
      </section>
    </main>
  </body>
</html>
