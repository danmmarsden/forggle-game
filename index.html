<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#191a1f">
    <title>Forggle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260508-circles1">
    <script defer src="app.js?v=20260508-circles1"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <p class="eyebrow">Colour code</p>
          <h1>Forggle</h1>
        </div>
        <div class="difficulty-control" aria-label="Difficulty" role="group">
          <button class="difficulty-button is-active" type="button" data-difficulty="medium">Medium</button>
          <button class="difficulty-button" type="button" data-difficulty="hard">Hard</button>
        </div>
        <div class="top-actions" aria-label="Game summary">
          <div class="stat">
            <span>Turn</span>
            <strong id="turn-count">1</strong>
          </div>
          <div class="stat score-stat is-target" data-best-difficulty="medium">
            <span>Medium Best</span>
            <strong data-best-score="medium">--</strong>
          </div>
          <div class="stat score-stat" data-best-difficulty="hard">
            <span>Hard Best</span>
            <strong data-best-score="hard">--</strong>
          </div>
          <button class="icon-button text-button" id="new-game" type="button">
            <span aria-hidden="true">&#8635;</span>
            <span>New</span>
          </button>
        </div>
      </header>

      <section class="palette-band" aria-labelledby="palette-heading">
        <h2 class="sr-only" id="palette-heading">Colour choices</h2>
        <div class="colour-tray" id="colour-tray"></div>
      </section>

      <section class="game-layout">
        <div class="board-area">
          <div class="secret-row" aria-label="Hidden target combination">
            <span class="secret-label">Target</span>
            <div class="secret-pegs" id="secret-pegs"></div>
          </div>
          <div class="board" id="board" aria-label="Guess board"></div>
        </div>
      </section>
    </main>
  </body>
</html>
